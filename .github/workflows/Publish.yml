name: Publish

# Started by build/Publish.cmd (see build/Start-PublishWorkflow.ps1); always publishes both NuGet and npm packages.
# "build/Publish.cmd -no-test" sets skip-tests, which skips the smoke tests.
# After publishing, it creates the GitHub release and mirrors the packages to GitHub Packages.
# The "release" environment requires an approval from one of its reviewers (repository settings) before the job runs.
# Both registries authenticate via trusted publishing, so the repository holds no API keys:
# - NuGet: a nuget.org trusted publishing policy for ActualLab/Fusion + Publish.yml + the "release" environment;
#   the NUGET_USER secret is the nuget.org profile name of that policy's creator.
# - npm: every @actuallab/* package lists ActualLab/Fusion + Publish.yml as its trusted publisher.
on:
  workflow_dispatch:
    inputs:
      skip-tests:
        description: Skip the smoke tests
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    # version.json's publicReleaseRefSpec: other branches get versions with a git hash suffix
    if: github.ref == 'refs/heads/master'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Trusted publishing exchanges the workflow's OIDC token for short-lived keys
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Avoid shallow clone for Nerdbank.GitVersioning
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing requires npm 11.5.1+
          node-version: '24'

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Get version
        id: version
        run: '"version=$(dotnet nbgv get-version -v NuGetPackageVersion)" >> $env:GITHUB_OUTPUT'

      - name: Install .NET workloads
        run: dotnet workload install wasm-tools

      - name: Install npm packages
        working-directory: ts
        run: npm ci

      # All TypeScript tests + the .NET tests marked with [Trait("Category", "Smoke")]
      - name: Run smoke tests
        if: ${{ !inputs.skip-tests }}
        run: ./Run-Tests.cmd smoke

      - name: Pack NuGet packages
        env:
          PUBLIC_BUILD: 1
        run: dotnet run --project build -c Release --no-launch-profile -- --configuration Release pack

      # The key it produces is valid for 1 hour, so it goes right before the push
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        env:
          PUBLIC_BUILD: 1
          ActualChat_NuGet_API_Key: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet run --project build -c Release --no-launch-profile -- --configuration Release --skip-dependencies publish

      - name: Publish npm packages
        working-directory: ts
        shell: pwsh
        run: ./Publish.ps1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            artifacts/nupkg/*.nupkg
            artifacts/npm/*.tgz
          if-no-files-found: error

  # A separate job, so the publishing one (which runs package build scripts) never gets write access to the repository.
  # "/publish" replaces these notes with the changelog entry once it's written.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: >
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$VERSION"
          --notes "NuGet and npm packages $VERSION. Changelog: https://fusion.actuallab.net/CHANGELOG"

  # Mirrors the packages to GitHub Packages, so they're listed on the repository page.
  # nuget.org and npmjs.com stay the primary feeds.
  github-packages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Push NuGet packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          dotnet nuget push "packages/nupkg/*.nupkg" --source "https://nuget.pkg.github.com/${GITHUB_REPOSITORY_OWNER}/index.json"
          --api-key "$GH_TOKEN" --skip-duplicate

      - name: Publish npm packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}" > ~/.npmrc
          for tarball in packages/npm/*.tgz; do
            npm publish "$tarball" --registry https://npm.pkg.github.com
          done
